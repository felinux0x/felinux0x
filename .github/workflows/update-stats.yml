name: Update Stats

# Atualiza automaticamente os cards de stats do README.
# Roda toda segunda-feira 03:00 UTC + manualmente (aba Actions > Update Stats > Run workflow).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow

      - name: Gerar cards de stats
        run: python scripts/update_stats.py

      - name: Commit e push se houver mudanca
        run: |
          git config user.name "fxlpz[bot]"
          git config user.email "fxlpz@users.noreply.github.com"
          git add img/stats.png img/langs.png
          if git diff --cached --quiet; then
            echo "sem mudancas, nada a commitar"
          else
            git commit -m "chore: atualizar stats cards"
            git push
          fi